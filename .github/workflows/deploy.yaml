name: Deploy to Runtime Manager
run-name: Deploy triggered by ${{ github.actor }}

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'
          cache: 'maven'

      - name: Install Maven 3.9.8
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.8'

      - name: Configure Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOSETTINGS
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${ANYPOINT_CLIENT_ID}~?~${ANYPOINT_CLIENT_SECRET}</password>
              </server>
              <server>
                <id>mulesoft-releases</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
              <!-- Required for MUnit EE runtime BOM resolution -->
              <server>
                <id>mulesoft-enterprise-repository</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOSETTINGS

      - name: Detect changed apps
        id: apps
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          APPS=()
          if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
            echo "github.event.before is missing or all zeros; no apps will be deployed."
          elif ! git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null; then
            echo "Commit ${BEFORE_SHA} is not available; no apps will be deployed."
          else
            mapfile -t CANDIDATES < <(git diff --name-only "${BEFORE_SHA}..${HEAD_SHA}" | awk -F/ 'NF { print $1 }' | sort -u)
            for ARTIFACT in "${CANDIDATES[@]}"; do
              if [[ -d "$ARTIFACT" && -f "$ARTIFACT/pom.xml" ]]; then
                APPS+=("$ARTIFACT")
              fi
            done
          fi
          {
            echo "apps<<EOF"
            if [[ ${#APPS[@]} -gt 0 ]]; then
              printf '%s\n' "${APPS[@]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ ${#APPS[@]} -eq 0 ]]; then
            echo "No application folders with pom.xml changed."
          else
            echo "Apps to process: ${APPS[*]}"
          fi

      - name: Publish to Exchange
        env:
          APPS: ${{ steps.apps.outputs.apps }}
        run: |
          if [[ -z "${APPS}" ]]; then
            echo "No apps to publish."
            exit 0
          fi
          while IFS= read -r ARTIFACT; do
            [[ -z "${ARTIFACT}" ]] && continue
            mvn deploy -f "${ARTIFACT}" -DskipMunitTests
            echo "---"
          done <<< "${APPS}"

      - name: Deploy to Runtime Manager
        env:
          ENVIRONMENT: ${{ vars.ANYPOINT_ENV }}
          POSTGRES_HOSTNAME: ${{ vars.POSTGRES_HOSTNAME }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          POSTGRES_SERVICE: ${{ vars.POSTGRES_SERVICE }}
          POSTGRES_USERNAME: ${{ vars.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APPS: ${{ steps.apps.outputs.apps }}
        run: |
          if [[ -z "${APPS}" ]]; then
            echo "No apps to deploy."
            exit 0
          fi
          while IFS= read -r ARTIFACT; do
            [[ -z "${ARTIFACT}" ]] && continue
            mvn deploy -Pcloudhub2-deploy -DmuleDeploy -f "${ARTIFACT}" -DskipTests
            echo "---"
          done <<< "${APPS}"
