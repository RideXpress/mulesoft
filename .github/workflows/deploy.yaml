name: Deploy to Runtime Manager
run-name: Deploy triggered by ${{ github.actor }}

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Required so HEAD~1 exists for the git diff

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: '17'

      - name: Install Maven 3.9.8
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.8'

      - name: Configure Maven settings
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOSETTINGS
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>${ANYPOINT_CLIENT_ID}~?~${ANYPOINT_CLIENT_SECRET}</password>
              </server>
              <server>
                <id>mulesoft-releases</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
              <!-- Required for MUnit EE runtime BOM resolution -->
              <server>
                <id>mulesoft-enterprise-repository</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOSETTINGS

      - name: Deploy to Runtime Manager
        env:
          ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
        run: |
          ARTIFACTS=$(git diff --name-only HEAD~1 | awk -F/ '{print $1}' | sort -u)
          for ARTIFACT in $ARTIFACTS
            do
              case $ARTIFACT in
                .github | util | docs | pom.xml | README.md)
                echo "---"
                ;;
              *)
                if [[ -d $ARTIFACT ]]; then
                  mvn deploy -Pcloudhub2-deploy -DmuleDeploy -f $ARTIFACT -Denv=develop 
                  echo "---"
                fi
                ;;
              esac
            done
          
